    <style id="gm-splash-css">
      #gm-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 20px;
        background: radial-gradient(circle at 50% 42%, #142c66 0%, #0a1633 56%, #060e22 100%);
        color: #ffffff;
        font-family: 'Manrope', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.32s;
      }
      #gm-splash.gm-splash--out {
        opacity: 0;
        transform: scale(1.035);
        visibility: hidden;
        pointer-events: none;
      }
      .gm-sp-stage {
        position: relative;
        width: 120px;
        height: 120px;
        display: grid;
        place-items: center;
        animation: gmSpPop 0.48s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .gm-sp-halo {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 184, 46, 0.28) 0%, rgba(245, 184, 46, 0) 70%);
        animation: gmSpPulse 1.8s ease-in-out infinite;
      }
      .gm-sp-track {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        border: 1.5px solid rgba(245, 184, 46, 0.22);
      }
      .gm-sp-orbit {
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(245, 184, 46, 0.08) 190deg, #f5b82e 315deg, #fff4cc 354deg, transparent 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
        animation: gmSpSpin 1.15s linear infinite;
      }
      .gm-sp-medallion {
        position: relative;
        width: 86px;
        height: 86px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(3, 8, 22, 0.55), 0 0 0 2px rgba(245, 184, 46, 0.42);
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      .gm-sp-medallion img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gm-sp-wordmark {
        margin-top: 22px;
        text-align: center;
        animation: gmSpRise 0.5s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .gm-sp-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.08em;
        line-height: 1.15;
        color: #ffffff;
        margin: 0;
      }
      .gm-sp-subbrand {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.28em;
        color: #f5b82e;
        text-transform: uppercase;
      }
      .gm-sp-tagline {
        margin: 12px 0 0;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.78);
        text-align: center;
        max-width: 280px;
        line-height: 1.4;
        animation: gmSpRise 0.52s 0.14s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .gm-sp-bar {
        margin-top: 22px;
        width: 144px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        animation: gmSpRise 0.52s 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .gm-sp-fill {
        height: 100%;
        width: 38%;
        border-radius: 999px;
        background: linear-gradient(90deg, #c8870a 0%, #f5b82e 55%, #fff2c2 100%);
        animation: gmSpLoad 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transition: width 0.2s ease;
      }
      #gm-splash.gm-splash--out .gm-sp-fill {
        width: 100% !important;
      }
      .gm-sp-mote {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 232, 158, 0.85) 0%, rgba(245, 184, 46, 0) 72%);
        pointer-events: none;
        animation: gmSpFloat 2.8s ease-in-out infinite;
      }
      .gm-sp-mote--1 { width: 7px; height: 7px; left: 22%; top: 34%; animation-delay: 0s; }
      .gm-sp-mote--2 { width: 5px; height: 5px; right: 23%; top: 38%; animation-delay: 0.5s; }
      .gm-sp-mote--3 { width: 6px; height: 6px; left: 28%; bottom: 32%; animation-delay: 0.9s; }
      .gm-sp-mote--4 { width: 5px; height: 5px; right: 26%; bottom: 35%; animation-delay: 1.3s; }
      @keyframes gmSpSpin { to { transform: rotate(360deg); } }
      @keyframes gmSpPulse { 0%, 100% { transform: scale(0.95); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes gmSpPop { from { opacity: 0; transform: scale(0.86); } to { opacity: 1; transform: scale(1); } }
      @keyframes gmSpRise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes gmSpLoad { 0% { width: 14%; } 65% { width: 78%; } 100% { width: 92%; } }
      @keyframes gmSpFloat { 0%, 100% { transform: translateY(0) scale(0.9); opacity: 0.35; } 50% { transform: translateY(-10px) scale(1.2); opacity: 0.85; } }
      @media (prefers-reduced-motion: reduce) {
        .gm-sp-orbit, .gm-sp-halo, .gm-sp-mote { animation: none !important; }
      }
    </style>
